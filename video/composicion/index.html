<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Every number on screen, generated by video/datos_video.py. -->
    <script src="assets/datos.js"></script>
    <style>
      /* Same type and palette as the case figures. Copy the colours this case passes to
         estilo.aplicar(acento=…, contra=…) in notebooks/graficos.py; the rest stays. */
      @font-face { font-family: "Inter"; font-weight: 400; src: url("assets/fonts/Inter-Regular.ttf"); }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/Inter-SemiBold.ttf"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url("assets/fonts/Inter-Bold.ttf"); }

      :root {
        --acento: #1f5fa8;
        --contra: #c2410c;
        --contexto: #8a877c;
        --tinta: #1a1815;
        --tinta-suave: #5a564c;
        --tinta-tenue: #807d73;
        --regla: #e2e0d9;
        --papel: #ffffff;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--papel);
      }
      body { font-family: "Inter", sans-serif; color: var(--tinta); }

      .clip { position: absolute; inset: 0; }

      /* Signature, as on every figure. The id overrides the full-frame box of .clip. */
      #firma {
        inset: auto 64px 48px auto;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--tinta-tenue);
      }
    </style>
  </head>
  <body>
    <!--
      Scene cuts follow the recorded voice (composicion/transcript.json): write them down here,
      e.g. "s1 0-7.0 · s2 7.0-12.0". Leave ~3 s after the last word so the closing card can be
      read over the music alone. mezclar_audio.py reads the root's data-duration, so the mix
      always matches it.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12.0"
      data-width="1920"
      data-height="1080"
    >
      <!-- Voice + music, one file: empalmar_voz.py → limpiar_voz.py → mezclar_audio.py. -->
      <audio
        id="mezcla"
        src="mezcla.wav"
        data-start="0"
        data-duration="12.0"
        data-track-index="0"
        data-volume="1"
      ></audio>

      <!-- One host per scene. Each scene runs on its own local clock, starting at 0. -->
      <div id="escena-1" class="clip" data-composition-id="s1" data-composition-src="compositions/s1.html"
           data-start="0" data-duration="7.0" data-track-index="1"></div>
      <div id="escena-2" class="clip" data-composition-id="s2" data-composition-src="compositions/s2.html"
           data-start="7.0" data-duration="5.0" data-track-index="1"></div>

      <div id="firma" class="clip" data-start="0" data-duration="12.0" data-track-index="2">JA</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
